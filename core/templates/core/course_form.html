{% extends "core/base.html" %}
{% block content %}
<h4 class="mb-3" style="color:#0f6e6e">Edit course</h4>
<div class="card" style="max-width:520px"><div class="card-body"><form method="post" class="row g-2">{% csrf_token %}
  {% for f in form %}<div class="col-12"><label class="form-label small mb-1">{{ f.label }}</label>{{ f }}
    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
  <div class="col-12 mt-3"><button class="btn text-white" style="background:#0f6e6e">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'course_list' %}">Cancel</a></div>
</form></div></div>
{% endblock %}
