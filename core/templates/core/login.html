{% extends "core/base.html" %}{% load static %}
{% block anon %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow-sm" style="max-width:380px;width:100%">
    <div class="card-body p-4">
      <div class="text-center mb-3">
        <img src="{% static 'img/logo.png' %}" alt="" style="width:84px;height:84px;object-fit:contain">
        <h5 class="mt-2 mb-1" style="color:#0f6e6e">{{ CENTRE_NAME }}</h5>
        <p class="text-muted small mb-0">{{ CENTRE_TAGLINE }}</p>
      </div>
      {% if form.errors %}<div class="alert alert-danger py-2 small">Wrong username or password.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label small">Username</label>
          <input name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label small">Password</label>
          <input name="password" type="password" class="form-control" required></div>
        <button class="btn w-100 text-white" style="background:#0f6e6e">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
