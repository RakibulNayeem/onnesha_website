{# Two month dropdowns (from / to). Drop inside a <form method="get">.
   Pass `with range_apply=1` where the form has no Apply button of its own. #}
<div class="input-group input-group-sm flex-nowrap">
  <span class="input-group-text">From</span>
  <select name="from" class="form-select form-select-sm">
    {% for v,l in month_options %}<option value="{{ v }}" {% if v == start_value %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  <span class="input-group-text">to</span>
  <select name="to" class="form-select form-select-sm">
    {% for v,l in month_options %}<option value="{{ v }}" {% if v == end_value %}selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  {% if range_apply %}<button class="btn btn-sm btn-outline-secondary">Apply</button>{% endif %}
</div>
