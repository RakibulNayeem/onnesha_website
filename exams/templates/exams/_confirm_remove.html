{% load bn %}<dialog id="rmdlg" class="dlg" aria-labelledby="rmtitle">
  <form method="post" action="{% url 'exam_friends' %}">{% csrf_token %}<input type="hidden" name="user" id="rmuser">
    <h3 id="rmtitle">{% t "বন্ধু তালিকা থেকে সরাবে?" %}</h3>
    <p class="muted"><b id="rmname"></b> {% t "আর তোমার বন্ধু থাকবে না। তার স্ট্রিক ও পয়েন্ট তুমি আর দেখতে পাবে না।" %}</p>
    <div class="dlg-btns"><button type="button" class="btn" data-rm-cancel>{% t "বাতিল" %}</button><button class="btn danger" name="do" value="remove">{% t "হ্যাঁ, সরাও" %}</button></div>
  </form></dialog>
<script>(function(){var d=document.getElementById('rmdlg');if(!d||!d.showModal)return;
 document.querySelectorAll('[data-confirm-remove]').forEach(function(b){b.addEventListener('click',function(){
  document.getElementById('rmuser').value=b.dataset.confirmRemove;document.getElementById('rmname').textContent=b.dataset.name;d.showModal()})});
 d.querySelector('[data-rm-cancel]').addEventListener('click',function(){d.close()});
 d.addEventListener('click',function(e){if(e.target===d)d.close()})})();</script>
