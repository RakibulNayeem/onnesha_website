# Render reads this automatically when you create a Blueprint from the repo.
# You can also ignore it and fill the same values into the web-service form.
services:
  - type: web
    name: onnesha
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn onnesha_finance.wsgi"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: TIME_ZONE
        value: "Asia/Dhaka"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string in the dashboard
      - key: CSRF_TRUSTED_ORIGINS
        sync: false        # https://your-service-name.onrender.com
